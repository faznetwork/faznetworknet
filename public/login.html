<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - Hotspot Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0d324d 0%, #7f5a83 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            text-align: center;
        }
        .logo-title {
            font-size: 24px;
            font-weight: 800;
            color: #0d324d;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .sub-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #0d324d;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #0d324d;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background: #1b4b6e;
        }
        .btn-submit:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        .alert-box {
            display: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .alert-error {
            background: #ffe6e6;
            color: #d63031;
            border: 1px solid #fab1a0;
        }
        .alert-success {
            background: #e8f8f5;
            color: #27ae60;
            border: 1px solid #a3e4d7;
        }
        .notice {
            margin-top: 18px;
            font-size: 12px;
            color: #555;
            line-height: 1.5;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            border-left: 3px solid #0d324d;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-title">FAZ NETWORK</div>
    <div class="sub-title">স্বয়ংক্রিয় হটস্পট লগইন পোর্টাল</div>

    <!-- স্ট্যাটাস / মেসেজ নোটিফিকেশন বক্স -->
    <div id="status-box" class="alert-box"></div>

    <!-- ইনপুট ফর্ম -->
    <div class="input-group">
        <label for="cust_phone">মোবাইল নম্বর (যে নম্বর থেকে টাকা পাঠিয়েছেন)</label>
        <input type="tel" id="cust_phone" placeholder="017xxxxxxxx" maxlength="11" />
    </div>

    <div class="input-group">
        <label for="cust_trx">ট্রানজেকশন আইডি (TrxID)</label>
        <input type="text" id="cust_trx" placeholder="যেমন: BLK78ABC9" style="text-transform: uppercase;" />
    </div>

    <button type="button" id="btn-login" class="btn-submit" onclick="handleVerification()">প্যাকেজ চালু ও লগইন করুন</button>

    <div class="notice">
        <b>প্যাকেজ অ্যাক্টিভেশন নিয়ম:</b><br>
        ১. bKash বা Nagad দিয়ে প্যাকেজের সঠিক টাকা পাঠান।<br>
        ২. ফিরতি SMS থেকে প্রাপ্ত TrxID ও নম্বর দিয়ে বাটনে চাপ দিন।
    </div>
</div>

<!-- মাইক্রোটিকের আসল লগইন ফর্ম (যা ব্যাকগ্রাউন্ডে রাউটারে লগইন সম্পন্ন করবে) -->
<form id="mikrotik-login-form" name="login" action="$(link-login-only)" method="post" style="display:none;">
    <input type="hidden" name="username" id="mt-user" />
    <input type="hidden" name="password" id="mt-pass" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
</form>

<script>
    // আপনার রেন্ডার সার্ভার ব্যাকএন্ড API
    const BACKEND_API_URL = 'https://faznetwork.onrender.com/api/verify-trx';

    function showStatus(text, isError = false) {
        const box = document.getElementById('status-box');
        box.style.display = 'block';
        box.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
        box.innerText = text;
    }

    async function handleVerification() {
        const phoneInput = document.getElementById('cust_phone').value.trim();
        const trxInput = document.getElementById('cust_trx').value.trim().toUpperCase();
        const btn = document.getElementById('btn-login');

        // প্রাথমিক ভ্যালিডেশন
        if (!phoneInput || phoneInput.length < 11) {
            showStatus('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন।', true);
            return;
        }

        if (!trxInput || trxInput.length < 5) {
            showStatus('সঠিক TrxID প্রদান করুন।', true);
            return;
        }

        // বাটন লোডিং স্টেট
        btn.disabled = true;
        btn.innerText = 'যাচাই করা হচ্ছে... অপেক্ষা করুন';
        showStatus('পেমেন্ট ও রাউটার ভেরিফাই করা হচ্ছে...');

        try {
            const response = await fetch(BACKEND_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: phoneInput,
                    trxId: trxInput
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showStatus('পেমেন্ট সফল! ইন্টারনেট কানেক্ট করা হচ্ছে...');

                // মাইক্রোটিকের হিডেন ফর্মে ইউজার ও পাসওয়ার্ড বসানো
                document.getElementById('mt-user').value = data.username;
                document.getElementById('mt-pass').value = data.password;

                // মাইক্রোটিক ফর্মে অটো-সাবমিট
                setTimeout(() => {
                    document.getElementById('mikrotik-login-form').submit();
                }, 800);

            } else {
                showStatus(data.message || 'যাচাই ব্যর্থ হয়েছে। TrxID সঠিক কি না নিশ্চিত করুন।', true);
                btn.disabled = false;
                btn.innerText = 'প্যাকেজ চালু ও লগইন করুন';
            }
        } catch (err) {
            console.error(err);
            showStatus('সার্ভারের সাথে সংযোগ করা যায়নি। ওয়াইফাই নেটওয়ার্ক চেক করুন।', true);
            btn.disabled = false;
            btn.innerText = 'প্যাকেজ চালু ও লগইন করুন';
        }
    }
</script>

</body>
</html>
