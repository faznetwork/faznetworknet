<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - Hotspot Portal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
            --bkash: #e2136e;
            --nagad: #f7941d;
            --rocket: #832b73;
            --upay: #0054a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(13, 148, 136, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(217, 119, 6, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: var(--text-main);
        }

        /* Mobile Lite RGB Glow Wrapper */
        .rgb-wrapper {
            position: relative;
            width: 100%;
            max-width: 390px;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(60deg, #ef4444, #f59e0b, #10b981, #06b6d4, #3b82f6, #8b5cf6, #ec4899);
            background-size: 400% 400%;
            animation: rgbBorderGlow 8s ease infinite;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        @keyframes rgbBorderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 20px 16px;
            text-align: center;
        }

        .device-badge-corner {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 9px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .bismillah {
            font-size: 17px;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-family: 'Amiri', 'TraditionalArabic', sans-serif;
        }

        .logo-box {
            margin-bottom: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 45px;
        }

        .logo-img {
            max-width: 80px;
            height: auto;
            object-fit: contain;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .tab-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 7px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .pkg-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pkg-card:hover {
            border-color: #10b981;
        }

        .pkg-card.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .pkg-time {
            font-size: 10px;
            font-weight: 700;
            color: #e2e8f0;
        }

        .pkg-price {
            font-size: 13px;
            font-weight: 800;
            color: #fbbf24;
            margin-top: 2px;
        }

        .selected-package {
            margin: 0 0 12px;
            color: #34d399;
            font-size: 11px;
            text-align: left;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.1);
            padding: 5px 8px;
            border-radius: 6px;
            border-left: 3px solid #10b981;
        }

        /* Professional MFS Official Cards */
        .mfs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .mfs-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            color: #ffffff;
        }

        .mfs-btn.bkash { border-color: rgba(226, 19, 110, 0.4); }
        .mfs-btn.bkash:hover { background: rgba(226, 19, 110, 0.15); border-color: var(--bkash); }

        .mfs-btn.nagad { border-color: rgba(247, 148, 29, 0.4); }
        .mfs-btn.nagad:hover { background: rgba(247, 148, 29, 0.15); border-color: var(--nagad); }

        .mfs-btn.rocket { border-color: rgba(131, 43, 115, 0.4); }
        .mfs-btn.rocket:hover { background: rgba(131, 43, 115, 0.15); border-color: var(--rocket); }

        .mfs-btn.upay { border-color: rgba(0, 84, 166, 0.4); }
        .mfs-btn.upay:hover { background: rgba(0, 84, 166, 0.15); border-color: var(--upay); }

        .mfs-logo-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 900;
            color: #fff;
        }

        .input-group {
            margin-bottom: 10px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .input-box input, .payment-method-select {
            width: 100%;
            padding: 9px 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box input:focus {
            border-color: #10b981;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.25);
        }

        .btn-action {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border: none;
            color: #ffffff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
            transition: all 0.25s ease;
            margin-top: 4px;
        }

        .btn-action:hover { background: #047857; }
        .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Professional Gateway Modal (SSLCommerz Style) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal-card {
            background: #111827;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .timer-box {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            font-weight: 800;
            font-size: 15px;
            padding: 5px 10px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .alert-box {
            display: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 10px;
            text-align: left;
        }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #6ee7b7; }

        .card-footer {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        .helpline {
            color: #fbbf24;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="rgb-wrapper">
    <div class="main-card">
        <div class="device-badge-corner" id="device-info-display">
            MAC: $(mac)
        </div>

        <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>

        <div class="logo-box">
            <img id="brand-logo" src="logo-Faznetwork.png" alt="FAZ Network Logo" class="logo-img" onerror="this.style.display='none'">
        </div>

        <div class="brand-title" id="brand-title-text">FAZ NETWORK</div>
        <div class="brand-subtitle" id="brand-subtitle-text">স্বয়ংক্রিয় হাই-স্পিড হটস্পট জোন</div>

        <div id="status-box" class="alert-box"></div>

        <!-- Tab Switcher -->
        <div class="tab-switcher">
            <button type="button" id="tab-recharge-btn" class="tab-btn active" onclick="switchPortalTab('recharge')">অনলাইন পেমেন্ট (MFS)</button>
            <button type="button" id="tab-voucher-btn" class="tab-btn" onclick="switchPortalTab('voucher')">ভাউচার পিন / QR</button>
        </div>

        <!-- 1. Online Recharge Tab -->
        <div id="section-recharge">
            <div class="packages-grid" id="packages-grid">
                <div style="grid-column: 1 / -1; font-size: 11px; color: var(--text-muted);">প্যাকেজ লোড হচ্ছে...</div>
            </div>
            <div id="selected-package" class="selected-package">চালিয়ে যেতে একটি প্যাকেজ নির্বাচন করুন।</div>

            <div style="font-size: 12px; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; text-align: left;">অফিসিয়াল পেমেন্ট মাধ্যম:</div>
            <div class="mfs-grid" id="mfs-buttons-grid">
                <!-- Dynamic Official MFS Buttons Loaded Here -->
            </div>
        </div>

        <!-- 2. Voucher & QR Code Scanner Tab -->
        <div id="section-voucher" style="display: none;">
            <div class="input-group">
                <label for="voucher_pin">ভাউচার স্ক্র্যাচ পিন কোড</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="voucher_pin" placeholder="পিন কোড লিখুন" style="flex: 1; padding: 9px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; color: #fff; text-transform: uppercase;">
                    <button type="button" class="btn-action" style="margin-top:0; width: auto; padding: 0 12px; font-size: 12px;" onclick="openQrScanner()">📷 স্ক্যান</button>
                </div>
            </div>
            <button type="button" class="btn-action" onclick="handleVoucherLogin()">ভাউচার দিয়ে ইন্টারনেট চালু করুন</button>
        </div>

        <div class="card-footer">
            <span>হেল্পলাইন:</span>
            <a href="tel:01339932887" class="helpline" id="footer-helpline">01339932887</a>
        </div>
    </div>
</div>

<!-- Professional MFS Payment Gateway Modal -->
<div class="modal-overlay" id="mfs-modal">
    <div class="modal-card">
        <h3 id="modal-mfs-title" style="margin-bottom: 6px; color: #ffffff; font-size: 16px;">পেমেন্ট গেটওয়ে</h3>
        <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px;">নিচের অফিসিয়াল নম্বরে সেন্ড মানি করুন:</p>
        
        <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px dashed rgba(255,255,255,0.2);">
            <span id="modal-wallet-number" style="font-size: 17px; font-weight: 800; color: #34d399; letter-spacing: 1px;">01XXXXXXXXX</span>
            <button type="button" onclick="copyWalletNumber()" style="display: block; margin: 4px auto 0; background: none; border: none; color: #60a5fa; font-size: 10px; cursor: pointer; font-weight: 700;">নম্বর কপি করুন</button>
        </div>

        <div class="timer-box" id="payment-timer">05:00</div>

        <div class="input-group">
            <label for="cust_phone">আপনার মোবাইল নম্বর</label>
            <div class="input-box"><input type="tel" id="cust_phone" placeholder="017xxxxxxxx" maxlength="11"></div>
        </div>

        <div class="input-group">
            <label for="cust_trx">TrxID প্রদান করুন</label>
            <div class="input-box"><input type="text" id="cust_trx" placeholder="যেমন: DJ38C3MQHG" style="text-transform: uppercase;"></div>
        </div>

        <button type="button" class="btn-action" id="btn-verify-payment" onclick="handleVerification()">পেমেন্ট নিশ্চিত ও সংযোগ করুন</button>
        <button type="button" onclick="closeMfsModal()" style="background: none; border: none; color: var(--text-muted); font-size: 11px; margin-top: 10px; cursor: pointer;">বাতিল করুন</button>
    </div>
</div>

<!-- Hidden MikroTik Auto-Login Form (Username = MAC, Password = MAC) -->
<form id="mikrotik-auto-login" name="mikrotik-auto-login" action="$(link-login-only)" method="post" style="display:none;">
    <input type="hidden" name="username" id="mt-user" value="$(mac)">
    <input type="hidden" name="password" id="mt-pass" value="$(mac)">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
</form>

<input type="hidden" id="router-mac" value="$(mac)">
<input type="hidden" id="router-ip" value="$(ip)">

<script>
    const BACKEND_BASE_URL = 'https://faznetwork.com';
    const BACKEND_API_URL = BACKEND_BASE_URL + '/api/verify-trx';
    const VOUCHER_API_URL = BACKEND_BASE_URL + '/api/hotspot/verify-voucher';
    const PUBLIC_SETTINGS_URL = BACKEND_BASE_URL + '/api/settings/public';

    let selectedPackage = null;
    let currentProvider = '';
    let paymentAccounts = {};
    let countdownTimer = null;

    function switchPortalTab(tab) {
        const secRecharge = document.getElementById('section-recharge');
        const secVoucher = document.getElementById('section-voucher');
        const btnRecharge = document.getElementById('tab-recharge-btn');
        const btnVoucher = document.getElementById('tab-voucher-btn');

        if (tab === 'recharge') {
            secRecharge.style.display = 'block';
            secVoucher.style.display = 'none';
            btnRecharge.classList.add('active');
            btnVoucher.classList.remove('active');
        } else {
            secRecharge.style.display = 'none';
            secVoucher.style.display = 'block';
            btnRecharge.classList.remove('active');
            btnVoucher.classList.add('active');
        }
    }

    function formatTaka(value) {
        const amount = Number(value);
        return Number.isFinite(amount) ? '৳ ' + amount.toLocaleString('en-BD') : '৳ —';
    }

    function renderPackages(packages) {
        const grid = document.getElementById('packages-grid');
        const summary = document.getElementById('selected-package');
        grid.replaceChildren();
        selectedPackage = null;
        summary.textContent = 'চালিয়ে যেতে একটি প্যাকেজ নির্বাচন করুন।';

        const valid = packages.filter(pkg => pkg.profile && Number(pkg.price) > 0);
        if (!valid.length) {
            grid.innerHTML = '<div style="grid-column:1/-1;font-size:11px;color:red;">কোনো প্যাকেজ পাওয়া যায়নি।</div>';
            return;
        }

        valid.forEach((pkg, index) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'pkg-card';

            if (index === 0) {
                card.classList.add('selected');
                selectedPackage = { profile: pkg.profile, price: Number(pkg.price), validity: pkg.validity || pkg.profile };
                summary.textContent = 'নির্বাচিত প্যাকেজ: ' + selectedPackage.validity + ' — ' + formatTaka(selectedPackage.price);
            }

            card.innerHTML = `<div class="pkg-time">${pkg.validity || pkg.profile}</div><div class="pkg-price">${formatTaka(pkg.price)}</div>`;
            card.addEventListener('click', () => {
                selectedPackage = { profile: pkg.profile, price: Number(pkg.price), validity: pkg.validity || pkg.profile };
                grid.querySelectorAll('.pkg-card').forEach(item => item.classList.remove('selected'));
                card.classList.add('selected');
                summary.textContent = 'নির্বাচিত প্যাকেজ: ' + selectedPackage.validity + ' — ' + formatTaka(selectedPackage.price);
            });
            grid.appendChild(card);
        });
    }

    function renderMfsButtons(accounts) {
        const grid = document.getElementById('mfs-buttons-grid');
        grid.replaceChildren();
        const labels = { 
            bkash: { name: 'bKash', color: '#e2136e', char: '৳' }, 
            nagad: { name: 'Nagad', color: '#f7941d', char: '৳' }, 
            rocket: { name: 'Rocket', color: '#832b73', char: 'R' }, 
            upay: { name: 'Upay', color: '#0054a6', char: 'U' } 
        };
        const activeProviders = Object.keys(labels).filter(k => accounts[k]);

        if (!activeProviders.length) {
            grid.innerHTML = '<div style="grid-column:1/-1;font-size:11px;color:orange;">কোনো পেমেন্ট মাধ্যম কনফিগার করা নেই।</div>';
            return;
        }

        activeProviders.forEach(prov => {
            const info = labels[prov];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `mfs-btn ${prov}`;
            btn.innerHTML = `<span class="mfs-logo-icon" style="background:${info.color}">${info.char}</span> <span>${info.name} দিয়ে পেমেন্ট</span>`;
            btn.addEventListener('click', () => openMfsModal(prov, accounts[prov], info.name + ' গেটওয়ে'));
            grid.appendChild(btn);
        });
    }

    async function loadPublicPortalData() {
        try {
            const [homeRes, setRes] = await Promise.all([
                fetch(BACKEND_BASE_URL + '/', { cache: 'no-store' }),
                fetch(PUBLIC_SETTINGS_URL, { cache: 'no-store' }).catch(() => null)
            ]);

            if (homeRes.ok) {
                const html = await homeRes.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const packages = Array.from(doc.querySelectorAll('[data-buy-hotspot][data-profile][data-price]')).map(b => ({
                    profile: b.getAttribute('data-profile'),
                    price: Number(b.getAttribute('data-price')),
                    validity: b.getAttribute('data-validity')
                }));
                renderPackages(packages);
            }

            if (setRes && setRes.ok) {
                const setJson = await setRes.json().catch(() => ({}));
                paymentAccounts = setJson?.settings?.payment_accounts || {};
                renderMfsButtons(paymentAccounts);

                const settings = setJson?.settings || {};
                if (settings.brand_title) document.getElementById('brand-title-text').textContent = settings.brand_title;
                if (settings.subtitle) document.getElementById('brand-subtitle-text').textContent = settings.subtitle;
                if (settings.helpline) {
                    const hp = document.getElementById('footer-helpline');
                    hp.textContent = settings.helpline;
                    hp.href = 'tel:' + settings.helpline;
                }
            }
        } catch (err) {
            renderPackages([{ profile: '1-Hour', price: 10, validity: '১ ঘণ্টা' }, { profile: '12-Hour', price: 20, validity: '১২ ঘণ্টা' }]);
            renderMfsButtons({ bkash: '01339932887', nagad: '01339932887' });
        }
    }

    function openMfsModal(provider, number, title) {
        if (!selectedPackage) {
            alert('দয়া করে প্রথমে একটি প্যাকেজ নির্বাচন করুন।');
            return;
        }
        currentProvider = provider;
        document.getElementById('modal-mfs-title').textContent = title;
        document.getElementById('modal-wallet-number').textContent = number;
        document.getElementById('mfs-modal').style.display = 'flex';
        startCountdown(300); // ৫ মিনিট
    }

    function closeMfsModal() {
        document.getElementById('mfs-modal').style.display = 'none';
        if (countdownTimer) clearInterval(countdownTimer);
    }

    function copyWalletNumber() {
        const num = document.getElementById('modal-wallet-number').textContent;
        navigator.clipboard.writeText(num);
        alert('নম্বরটি কপি হয়েছে: ' + num);
    }

    function startCountdown(durationSeconds) {
        if (countdownTimer) clearInterval(countdownTimer);
        let timer = durationSeconds;
        const display = document.getElementById('payment-timer');
        countdownTimer = setInterval(() => {
            let minutes = parseInt(timer / 60, 10);
            let seconds = parseInt(timer % 60, 10);
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            display.textContent = minutes + ":" + seconds;
            if (--timer < 0) {
                clearInterval(countdownTimer);
                alert('সময় শেষ! পেমেন্ট উইন্ডোটি বাতিল করা হলো।');
                closeMfsModal();
            }
        }, 1000);
    }

    async function handleVerification() {
        const phoneInput = document.getElementById('cust_phone').value.trim();
        const trxInput = document.getElementById('cust_trx').value.trim().toUpperCase();
        const routerMac = document.getElementById('router-mac').value.trim();
        const routerIp = document.getElementById('router-ip').value.trim();
        const btn = document.getElementById('btn-verify-payment');

        if (!/^01\d{9}$/.test(phoneInput)) {
            alert('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন।');
            return;
        }
        if (!trxInput || trxInput.length < 5) {
            alert('সঠিক TrxID প্রদান করুন।');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'যাচাই করা হচ্ছে...';

        try {
            const res = await fetch(BACKEND_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: routerMac,
                    account_phone: phoneInput,
                    password: routerMac, // Username = Password = MAC
                    trxId: trxInput,
                    amount: selectedPackage.price,
                    profile_id: selectedPackage.profile,
                    paymentMethod: currentProvider,
                    mac: routerMac,
                    ip: routerIp
                })
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok || !data.success) {
                alert(data.message || data.error || 'পেমেন্ট ভেরিফিকেশন ব্যর্থ হয়েছে।');
                btn.disabled = false;
                btn.textContent = 'পেমেন্ট নিশ্চিত ও সংযোগ করুন';
                return;
            }

            const autoForm = document.getElementById('mikrotik-auto-login');
            document.getElementById('mt-user').value = routerMac;
            document.getElementById('mt-pass').value = routerMac;

            alert('আলহামদুলিল্লাহ! রিচার্জ সফল হয়েছে। ইন্টারনেট সংযুক্ত হচ্ছে...');
            autoForm.submit();

        } catch (err) {
            alert('সার্ভারের সাথে সংযোগ করা যায়নি। আবার চেষ্টা করুন।');
            btn.disabled = false;
            btn.textContent = 'পেমেন্ট নিশ্চিত ও সংযোগ করুন';
        }
    }

    async function openQrScanner() {
        if (!('BarcodeDetector' in window)) {
            const code = prompt('ভাউচার পিন বা QR টেক্সট দিন:');
            if (code) document.getElementById('voucher_pin').value = code.trim().toUpperCase();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const detector = new BarcodeDetector({ formats: ['qr_code'] });
            
            alert('ক্যামেরা চালু হয়েছে। QR কোড স্ক্যান করুন...');
            const scanInterval = setInterval(async () => {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const barcodes = await detector.detect(canvas).catch(() => []);
                    if (barcodes.length > 0) {
                        clearInterval(scanInterval);
                        stream.getTracks().forEach(t => t.stop());
                        video.remove();
                        document.getElementById('voucher_pin').value = barcodes[0].rawValue.trim().toUpperCase();
                        alert('QR স্ক্যান সফল!');
                    }
                }
            }, 200);
        } catch (e) {
            alert('ক্যামেরা পারমিশন পাওয়া যায়নি।');
        }
    }

    async function handleVoucherLogin() {
        const pin = document.getElementById('voucher_pin').value.trim().toUpperCase();
        const routerMac = document.getElementById('router-mac').value.trim();
        const routerIp = document.getElementById('router-ip').value.trim();

        if (!pin) {
            alert('ভাউচার পিন দিন।');
            return;
        }

        try {
            const res = await fetch(VOUCHER_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ voucher_code: pin, mac: routerMac, ip: routerIp })
            });
            const data = await res.json().catch(() => JSON.parse('{"success": false}'));
            if (!res.ok || !data.success) {
                alert(data.message || 'ভাউচার সঠিক নয় বা ব্যবহৃত হয়েছে।');
                return;
            }

            const autoForm = document.getElementById('mikrotik-auto-login');
            document.getElementById('mt-user').value = routerMac;
            document.getElementById('mt-pass').value = routerMac;
            autoForm.submit();
        } catch (err) {
            alert('সার্ভার ত্রুটি।');
        }
    }

    document.addEventListener('DOMContentLoaded', loadPublicPortalData);
</script>
