<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - Hotspot Portal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.12);
            --bkash: #e2136e;
            --nagad: #f7941d;
            --rocket: #832b73;
            --upay: #0054a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(245, 158, 11, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: var(--text-main);
        }

        /* Mobile Lite RGB Glow Wrapper */
        .rgb-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 22px;
            padding: 2px;
            background: linear-gradient(60deg, #ef4444, #f59e0b, #10b981, #06b6d4, #3b82f6, #8b5cf6, #ec4899);
            background-size: 400% 400%;
            animation: rgbBorderGlow 8s ease infinite;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        @keyframes rgbBorderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 22px 18px;
            text-align: center;
            position: relative;
        }

        .device-badge-corner {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 9px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.07);
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .bismillah {
            font-size: 18px;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-family: 'Amiri', 'Traditional Arabic', sans-serif;
        }

        .logo-box {
            margin-bottom: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 48px;
        }

        .logo-img {
            max-width: 85px;
            height: auto;
            object-fit: contain;
        }

        .brand-title {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .tab-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .pkg-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 9px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pkg-card:hover {
            border-color: #10b981;
        }

        .pkg-card.selected {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
        }

        .pkg-time {
            font-size: 11px;
            font-weight: 700;
            color: #f8fafc;
        }

        .pkg-price {
            font-size: 14px;
            font-weight: 800;
            color: #fbbf24;
            margin-top: 2px;
        }

        .selected-package {
            margin: 0 0 12px;
            color: #34d399;
            font-size: 12px;
            text-align: left;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.12);
            padding: 6px 10px;
            border-radius: 6px;
            border-left: 3px solid #10b981;
        }

        /* Professional MFS Official Cards */
        .mfs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .mfs-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            color: #ffffff;
        }

        .mfs-btn.bkash:hover { background: rgba(226, 19, 110, 0.2); border-color: var(--bkash); }
        .mfs-btn.nagad:hover { background: rgba(247, 148, 29, 0.2); border-color: var(--nagad); }
        .mfs-btn.rocket:hover { background: rgba(131, 43, 115, 0.2); border-color: var(--rocket); }
        .mfs-btn.upay:hover { background: rgba(0, 84, 166, 0.2); border-color: var(--upay); }

        .mfs-logo-icon {
            width: 22px;
            height: 22px;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
            color: #fff;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        .input-box input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box input:focus {
            border-color: #10b981;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border: none;
            color: #ffffff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.35);
            transition: all 0.25s ease;
            margin-top: 4px;
        }

        .btn-action:hover { background: #047857; }
        .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Professional Gateway Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        .modal-card {
            background: #1f2937;
            width: 100%;
            max-width: 380px;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.6);
        }

        .timer-box {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            font-weight: 800;
            font-size: 16px;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 12px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .card-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
        }

        .helpline {
            color: #fbbf24;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="rgb-wrapper">
    <div class="main-card">
        <div class="device-badge-corner" id="device-info-display">
            MAC: $(mac)
        </div>

        <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>

        <div class="logo-box">
            <img id="brand-logo" src="logo-Faznetwork.png" alt="FAZ Network Logo" class="logo-img" onerror="this.style.display='none'">
        </div>

        <div class="brand-title" id="brand-title-text">FAZ NETWORK</div>
        <div class="brand-subtitle" id="brand-subtitle-text">স্বয়ংক্রিয় হাই-স্পিড হটস্পট জোন</div>

        <!-- Tab Switcher -->
        <div class="tab-switcher">
            <button type="button" id="tab-recharge-btn" class="tab-btn active" onclick="switchPortalTab('recharge')">অনলাইন পেমেন্ট (MFS)</button>
            <button type="button" id="tab-voucher-btn" class="tab-btn" onclick="switchPortalTab('voucher')">ভাউচার পিন / QR</button>
        </div>

        <!-- 1. Online Recharge Tab -->
        <div id="section-recharge">
            <div class="packages-grid" id="packages-grid">
                <div style="grid-column: 1 / -1; font-size: 12px; color: var(--text-muted);">প্যাকেজ লোড হচ্ছে...</div>
            </div>
            <div id="selected-package" class="selected-package">চালিয়ে যেতে একটি প্যাকেজ নির্বাচন করুন।</div>

            <div style="font-size: 13px; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; text-align: left;">অফিসিয়াল পেমেন্ট মাধ্যম:</div>
            <div class="mfs-grid" id="mfs-buttons-grid">
                <!-- Dynamic Official MFS Buttons -->
            </div>
        </div>

        <!-- 2. Voucher & QR Code Scanner Tab -->
        <div id="section-voucher" style="display: none;">
            <div class="input-group">
                <label for="voucher_pin">ভাউচার স্ক্র্যাচ পিন কোড</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="voucher_pin" placeholder="পিন কোড লিখুন" style="flex: 1; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; color: #fff; text-transform: uppercase;">
                    <button type="button" class="btn-action" style="margin-top:0; width: auto; padding: 0 14px; font-size: 13px;" onclick="openQrScanner()">📷 স্ক্যান</button>
                </div>
            </div>
            <button type="button" class="btn-action" onclick="handleVoucherLogin()">ভাউচার দিয়ে ইন্টারনেট চালু করুন</button>
        </div>

        <div class="card-footer">
            <span>হেল্পলাইন:</span>
            <a href="tel:01339932887" class="helpline" id="footer-helpline">01339932887</a>
        </div>
    </div>
</div>

<!-- Professional MFS Payment Gateway Modal -->
<div class="modal-overlay" id="mfs-modal">
    <div class="modal-card">
        <h3 id="modal-mfs-title" style="margin-bottom: 6px; color: #ffffff; font-size: 17px;">পেমেন্ট গেটওয়ে</h3>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">নিচের অফিসিয়াল নম্বরে সেন্ড মানি করুন:</p>
        
        <div style="background: rgba(255,255,255,0.06); padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px dashed rgba(255,255,255,0.25);">
            <div id="modal-package-info" style="font-size: 12px; color: #34d399; font-weight: 700; margin-bottom: 4px;">প্যাকেজ: ৳০</div>
            <span id="modal-wallet-number" style="font-size: 19px; font-weight: 800; color: #fbbf24; letter-spacing: 1px;">01XXXXXXXXX</span>
            <button type="button" onclick="copyWalletNumber()" style="display: block; margin: 6px auto 0; background: none; border: none; color: #60a5fa; font-size: 11px; cursor: pointer; font-weight: 700;">নম্বর কপি করুন</button>
        </div>

        <div class="timer-box" id="payment-timer">05:00</div>

        <div class="input-group">
            <label for="cust_phone">আপনার মোবাইল নম্বর (যেটিতে নেট চালাবেন)</label>
            <div class="input-box"><input type="tel" id="cust_phone" placeholder="017xxxxxxxx" maxlength="11"></div>
        </div>

        <div class="input-group">
            <label for="cust_trx">বিকাশ/নগদের TrxID দিন</label>
            <div class="input-box"><input type="text" id="cust_trx" placeholder="যেমন: DJ38C3MQHG" style="text-transform: uppercase;"></div>
        </div>

        <button type="button" class="btn-action" id="btn-verify-payment" onclick="handleVerification()">পেমেন্ট নিশ্চিত ও সংযোগ করুন</button>
        <button type="button" onclick="closeMfsModal()" style="background: none; border: none; color: var(--text-muted); font-size: 12px; margin-top: 12px; cursor: pointer;">বাতিল করুন</button>
    </div>
</div>

<!-- Hidden MikroTik Auto-Login Form (Username = MAC, Password = MAC) -->
<form id="mikrotik-auto-login" name="mikrotik-auto-login" action="$(link-login-only)" method="post" style="display:none;">
    <input type="hidden" name="username" id="mt-user" value="$(mac)">
    <input type="hidden" name="password" id="mt-pass" value="$(mac)">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
</form>

<input type="hidden" id="router-mac" value="$(mac)">
<input type="hidden" id="router-ip" value="$(ip)">

<script>
    const BACKEND_BASE_URL = 'https://faznetwork.com';
    const BACKEND_API_URL = BACKEND_BASE_URL + '/api/verify-trx';
    const VOUCHER_API_URL = BACKEND_BASE_URL + '/api/hotspot/verify-voucher';
    const PUBLIC_SETTINGS_URL = BACKEND_BASE_URL + '/api/settings/public';

    let selectedPackage = null;
    let currentProvider = '';
    let paymentAccounts = {};
    let countdownTimer = null;

    function switchPortalTab(tab) {
        const secRecharge = document.getElementById('section-recharge');
        const secVoucher = document.getElementById('section-voucher');
        const btnRecharge = document.getElementById('tab-recharge-btn');
        const btnVoucher = document.getElementById('tab-voucher-btn');

        if (tab === 'recharge') {
            secRecharge.style.display = 'block';
            secVoucher.style.display = 'none';
            btnRecharge.classList.add('active');
            btnVoucher.classList.remove('active');
        } else {
            secRecharge.style.display = 'none';
            secVoucher.style.display = 'block';
            btnRecharge.classList.remove('active');
            btnVoucher.classList.add('active');
        }
    }

    function formatTaka(value) {
        const amount = Number(value);
        return Number.isFinite(amount) ? '৳ ' + amount.toLocaleString('en-BD') : '৳ —';
    }

    function renderPackages(packages) {
        const grid = document.getElementById('packages-grid');
        const summary = document.getElementById('selected-package');
        grid.replaceChildren();
        selectedPackage = null;
        summary.textContent = 'চালিয়ে যেতে একটি প্যাকেজ নির্বাচন করুন।';

        const valid = packages.filter(pkg => pkg.profile && Number(pkg.price) > 0);
        if (!valid.length) {
            grid.innerHTML = '<div style="grid-column:1/-1;font-size:12px;color:#f87171;">কোনো প্যাকেজ পাওয়া যায়নি।</div>';
            return;
        }

        valid.forEach((pkg, index) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'pkg-card';

            if (index === 0) {
                card.classList.add('selected');
                selectedPackage = { profile: pkg.profile, price: Number(pkg.price), validity: pkg.validity || pkg.profile };
                summary.textContent = 'নির্বাচিত প্যাকেজ: ' + selectedPackage.validity + ' — ' + formatTaka(selectedPackage.price);
            }

            card.innerHTML = `<div class="pkg-time">${pkg.validity || pkg.profile}</div><div class="pkg-price">${formatTaka(pkg.price)}</div>`;
            card.addEventListener('click', () => {
                selectedPackage = { profile: pkg.profile, price: Number(pkg.price), validity: pkg.validity || pkg.profile };
                grid.querySelectorAll('.pkg-card').forEach(item => item.classList.remove('selected'));
                card.classList.add('selected');
                summary.textContent = 'নির্বাচিত প্যাকেজ: ' + selectedPackage.validity + ' — ' + formatTaka(selectedPackage.price);
            });
            grid.appendChild(card);
        });
    }

    function renderMfsButtons(accounts) {
        const grid = document.getElementById('mfs-buttons-grid');
        grid.replaceChildren();
        const labels = { 
            bkash: { name: 'bKash', color: '#e2136e', char: '৳' }, 
            nagad: { name: 'Nagad', color: '#f7941d', char: '৳' }, 
            rocket: { name: 'Rocket', color: '#832b73', char: 'R' }, 
            upay: { name: 'Upay', color: '#0054a6', char: 'U' } 
        };
        const activeProviders = Object.keys(labels).filter(k => {
            const value = accounts[k];
            return typeof value === 'string' ? value.trim().length > 0 :
                Boolean(value && (value.number || value.account_number || value.accountNumber || value.wallet));
        });

        if (!activeProviders.length) {
            grid.innerHTML = '<div style="grid-column:1/-1;font-size:12px;color:#fbbf24;">পেমেন্ট মাধ্যম কনফিগার করা নেই।</div>';
            return;
        }

        activeProviders.forEach(prov => {
            const info = labels[prov];
            const account = accounts[prov];
            const number = typeof account === 'string' ? account : (account.number || account.account_number || account.accountNumber || account.wallet);
            const enabled = typeof account === 'object' && account !== null
                ? !(account.enabled === false || account.active === false || account.is_active === false)
                : true;
            if (!enabled || !String(number || '').trim()) return;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `mfs-btn ${prov}`;
            btn.innerHTML = `<span class="mfs-logo-icon" style="background:${info.color}">${info.char}</span> <span>${info.name}</span>`;
            btn.addEventListener('click', () => openMfsModal(prov, String(number).trim(), info.name + ' গেটওয়ে'));
            grid.appendChild(btn);
        });
        if (!grid.children.length) {
            grid.innerHTML = '<div style="grid-column:1/-1;font-size:12px;color:#fbbf24;">সক্রিয় পেমেন্ট অ্যাকাউন্ট পাওয়া যায়নি।</div>';
        }
    }

    async function loadPublicPortalData() {
        try {
            const [homeRes, setRes] = await Promise.all([
                fetch(BACKEND_BASE_URL + '/', { cache: 'no-store' }),
                fetch(PUBLIC_SETTINGS_URL, { cache: 'no-store' }).catch(() => null)
            ]);

            if (homeRes.ok) {
                const html = await homeRes.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const packages = Array.from(doc.querySelectorAll('[data-buy-hotspot][data-profile][data-price]')).map(b => ({
                    profile: b.getAttribute('data-profile'),
                    price: Number(b.getAttribute('data-price')),
                    validity: b.getAttribute('data-validity')
                }));
                renderPackages(packages);
            }

            if (setRes && setRes.ok) {
                const setJson = await setRes.json().catch(() => ({}));
                paymentAccounts = setJson?.settings?.payment_accounts || {};
                renderMfsButtons(paymentAccounts);

                const settings = setJson?.settings || {};
                if (settings.brand_title) document.getElementById('brand-title-text').textContent = settings.brand_title;
                if (settings.subtitle) document.getElementById('brand-subtitle-text').textContent = settings.subtitle;
                if (settings.helpline) {
                    const hp = document.getElementById('footer-helpline');
                    hp.textContent = settings.helpline;
                    hp.href = 'tel:' + settings.helpline;
                }
            }
        } catch (err) {
            console.error('Unable to load public hotspot portal data:', err);
            renderPackages([]);
            renderMfsButtons({});
        }
    }

    function openMfsModal(provider, number, title) {
        if (!selectedPackage) {
            alert('দয়া করে প্রথমে একটি প্যাকেজ নির্বাচন করুন।');
            return;
        }
        currentProvider = provider;
        document.getElementById('modal-mfs-title').textContent = title;
        document.getElementById('modal-wallet-number').textContent = number;
        document.getElementById('modal-package-info').textContent = `নির্বাচিত প্যাকেজ: ${selectedPackage.validity} (${formatTaka(selectedPackage.price)})`;
        document.getElementById('mfs-modal').style.display = 'flex';
        startCountdown(300); // ৫ মিনিট
    }

    function closeMfsModal() {
        document.getElementById('mfs-modal').style.display = 'none';
        if (countdownTimer) clearInterval(countdownTimer);
    }

    async function copyWalletNumber() {
        const num = document.getElementById('modal-wallet-number').textContent.trim();
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(num);
            } else {
                const field = document.createElement('textarea');
                field.value = num;
                field.setAttribute('readonly', '');
                field.style.position = 'fixed';
                field.style.opacity = '0';
                document.body.appendChild(field);
                field.select();
                const copied = document.execCommand('copy');
                field.remove();
                if (!copied) throw new Error('Copy unavailable');
            }
            alert('অফিসিয়াল নম্বরটি কপি হয়েছে: ' + num);
        } catch (_) {
            alert('নম্বরটি কপি করা যায়নি। অনুগ্রহ করে হাতে কপি করুন: ' + num);
        }
    }

    function startCountdown(durationSeconds) {
        if (countdownTimer) clearInterval(countdownTimer);
        let timer = Math.max(0, Number(durationSeconds) || 0);
        const display = document.getElementById('payment-timer');
        const verifyButton = document.getElementById('btn-verify-payment');
        const renderTime = () => {
            const minutes = String(Math.floor(timer / 60)).padStart(2, '0');
            const seconds = String(timer % 60).padStart(2, '0');
            display.textContent = minutes + ':' + seconds;
        };
        renderTime();
        verifyButton.disabled = false;
        countdownTimer = setInterval(() => {
            timer = Math.max(0, timer - 1);
            renderTime();
            if (timer === 0) {
                clearInterval(countdownTimer);
                countdownTimer = null;
                verifyButton.disabled = true;
                alert('সময় শেষ! পেমেন্ট উইন্ডোটি বন্ধ হয়েছে। নতুন করে পেমেন্ট শুরু করুন।');
            }
        }, 1000);
    }

    function normalizeRouterMac(value) {
        const hex = String(value || '').trim().toUpperCase().replace(/[^0-9A-F]/g, '');
        if (hex.length !== 12) return '';
        return hex.match(/.{2}/g).join(':');
    }

    async function handleVerification() {
        const phoneInput = document.getElementById('cust_phone').value.trim();
        const trxInput = document.getElementById('cust_trx').value.trim().toUpperCase();
        const routerMac = normalizeRouterMac(document.getElementById('router-mac').value);
        const routerIp = document.getElementById('router-ip').value.trim();
        const btn = document.getElementById('btn-verify-payment');

        if (!/^01\d{9}$/.test(phoneInput)) {
            alert('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন।');
            return;
        }
        if (!trxInput || trxInput.length < 5) {
            alert('সঠিক TrxID প্রদান করুন।');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'যাচাই করা হচ্ছে...';

        try {
            const res = await fetch(BACKEND_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: routerMac,
                    account_phone: phoneInput,
                    password: routerMac, // Username = Password = MAC
                    trxId: trxInput,
                    amount: selectedPackage.price,
                    profile_id: selectedPackage.profile,
                    paymentMethod: currentProvider,
                    mac: routerMac,
                    ip: routerIp
                })
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok || !data.success) {
                alert(data.message || data.error || 'পেমেন্ট ভেরিফিকেশন ব্যর্থ হয়েছে।');
                btn.disabled = false;
                btn.textContent = 'পেমেন্ট নিশ্চিত ও সংযোগ করুন';
                return;
            }

            const autoForm = document.getElementById('mikrotik-auto-login');
            document.getElementById('mt-user').value = routerMac;
            document.getElementById('mt-pass').value = routerMac;

            alert('আলহামদুলিল্লাহ! রিচার্জ সফল হয়েছে। ইন্টারনেট সংযুক্ত হচ্ছে...');
            autoForm.submit();

        } catch (err) {
            alert('সার্ভারের সাথে সংযোগ করা যায়নি। আবার চেষ্টা করুন।');
            btn.disabled = false;
            btn.textContent = 'পেমেন্ট নিশ্চিত ও সংযোগ করুন';
        }
    }

    async function openQrScanner() {
        if (!('BarcodeDetector' in window)) {
            const code = prompt('ভাউচার পিন বা QR টেক্সট দিন:');
            if (code) document.getElementById('voucher_pin').value = code.trim().toUpperCase();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const detector = new BarcodeDetector({ formats: ['qr_code'] });
            
            alert('ক্যামেরা চালু হয়েছে। QR কোড স্ক্যান করুন...');
            const scanInterval = setInterval(async () => {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const barcodes = await detector.detect(canvas).catch(() => []);
                    if (barcodes.length > 0) {
                        clearInterval(scanInterval);
                        stream.getTracks().forEach(t => t.stop());
                        video.remove();
                        document.getElementById('voucher_pin').value = barcodes[0].rawValue.trim().toUpperCase();
                        alert('QR স্ক্যান সফল!');
                    }
                }
            }, 200);
        } catch (e) {
            alert('ক্যামেরা পারমিশন পাওয়া যায়নি।');
        }
    }

    async function handleVoucherLogin() {
        const pin = document.getElementById('voucher_pin').value.trim().toUpperCase();
        const routerMac = normalizeRouterMac(document.getElementById('router-mac').value);
        const routerIp = document.getElementById('router-ip').value.trim();

        if (!pin) {
            alert('ভাউচার পিন দিন।');
            return;
        }

        try {
            const res = await fetch(VOUCHER_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ voucher_code: pin, mac: routerMac, ip: routerIp })
            });
            const data = await res.json().catch(() => JSON.parse('{"success": false}'));
            if (!res.ok || !data.success) {
                alert(data.message || 'ভাউচার সঠিক নয় বা ব্যবহৃত হয়েছে।');
                return;
            }

            const autoForm = document.getElementById('mikrotik-auto-login');
            document.getElementById('mt-user').value = routerMac;
            document.getElementById('mt-pass').value = routerMac;
            autoForm.submit();
        } catch (err) {
            alert('সার্ভার ত্রুটি।');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const mac = normalizeRouterMac(document.getElementById('router-mac').value);
        if (mac) {
            document.getElementById('router-mac').value = mac;
            document.getElementById('mt-user').value = mac;
            document.getElementById('mt-pass').value = mac;
            const badge = document.querySelector('.device-badge-corner');
            if (badge) badge.textContent = 'MAC: ' + mac;
        }
        loadPublicPortalData();
    });
</script>
