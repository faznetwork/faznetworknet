<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FAZ NETWORK Hotspot Login</title>
  <style>
    :root{color-scheme:dark;--green:#0a3d2e;--accent:#10b981;--gold:#f59e0b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#0b4b38,#041812 68%);font-family:system-ui,sans-serif;color:#f0fdf4}
    main{width:min(100%,420px);padding:26px;border:1px solid #10b98166;border-radius:20px;background:#09251eeF;box-shadow:0 20px 60px #0008}
    h1{text-align:center;margin:0;color:white;font-size:25px}p{color:#a7f3d0;text-align:center;font-size:13px;line-height:1.6}
    label{display:block;font-size:13px;margin:18px 0 6px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff30;background:#041812;color:white;font-size:16px}
    button,.pay{display:block;width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,#10b981,#047857);color:white;font-weight:800;font-size:15px;text-align:center;text-decoration:none;cursor:pointer}
    .status{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#7f1d1d;color:#fee2e2;font-size:13px}
    small{display:block;text-align:center;color:#94a3b8;margin-top:16px}
  </style>
</head>
<body>
<main>
  <h1>FAZ NETWORK</h1>
  <p>ইন্টারনেট চালু করতে আপনার নিবন্ধিত ১১ ডিজিটের মোবাইল নম্বর দিন। ডিভাইসের MAC Address স্বয়ংক্রিয়ভাবে ব্যবহার হবে।</p>
  <form id="hotspot-login" name="login" action="$(link-login-only)" method="post">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
    <input type="hidden" id="router-mac" value="$(mac)">
    <input type="hidden" name="username" id="router-username" value="$(mac)">
    <input type="hidden" name="password" id="router-password">
    <label for="customer-phone">গ্রাহকের মোবাইল নম্বর (Password)</label>
    <input id="customer-phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="017xxxxxxxx" required>
    <div id="status" class="status" role="alert"></div>
    <button type="submit">ইন্টারনেট চালু করুন</button>
  </form>
  <a class="pay" href="https://faznetwork-web.onrender.com/portal?mac=$(mac)">নতুন প্যাকেজ কিনুন / রিচার্জ</a>
  <small>Username = Device MAC Address · Password = Customer Phone</small>
</main>
<script>
(function(){
  const form=document.getElementById("hotspot-login");
  const phoneInput=document.getElementById("customer-phone");
  const status=document.getElementById("status");
  const button=form.querySelector('button[type="submit"]');
  function digits(value){const bn="০১২৩৪৫৬৭৮৯";return String(value||"").replace(/[০-৯]/g,ch=>String(bn.indexOf(ch))).replace(/\D/g,"");}
  function normalizeMac(value){const compact=String(value||"").trim().replace(/[:-]/g,"");return /^[0-9a-fA-F]{12}$/.test(compact)?compact.match(/.{2}/g).join(":").toUpperCase():"";}
  function normalizePhone(value){let d=digits(value);if(d.startsWith("880")&&d.length===13)d="0"+d.slice(3);return /^01[0-9]{9}$/.test(d)?d:"";}
  function showError(message){status.style.display="block";status.textContent=message;}
  form.addEventListener("submit",async function(event){
    event.preventDefault();
    const mac=normalizeMac(document.getElementById("router-mac").value),phone=normalizePhone(phoneInput.value);
    if(!mac){showError("RouterOS থেকে ডিভাইসের MAC Address পাওয়া যায়নি।");return;}
    if(!phone){showError("সঠিক ১১ ডিজিটের বাংলাদেশি মোবাইল নম্বর দিন।");return;}
    status.style.display="none";button.disabled=true;button.textContent="যাচাই হচ্ছে…";
    try{
      const response=await fetch("https://faznetwork-web.onrender.com/api/hotspot-auth/activate",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({mac,phone})});
      const data=await response.json();
      if(!response.ok||!data.success){
        const messages={NO_ELIGIBLE_PACKAGE:"এই নম্বরে কোনো pending বা active প্যাকেজ পাওয়া যায়নি। আগে প্যাকেজ কিনুন।",PACKAGE_EXPIRED:"আপনার প্যাকেজের মেয়াদ শেষ। নতুন প্যাকেজ কিনুন।",MAC_MISMATCH:"এই নম্বরটি আগে অন্য ডিভাইসে bind হয়েছে। Support-এর সঙ্গে যোগাযোগ করুন।",MAC_ALREADY_BOUND:"এই ডিভাইস অন্য একটি ফোন নম্বরে bind করা আছে। Support-এর সঙ্গে যোগাযোগ করুন.",PROFILE_NOT_FOUND:"প্যাকেজের profile পাওয়া যায়নি। Support-এর সঙ্গে যোগাযোগ করুন.",EXPIRY_NOT_RECORDED:"এই account-এর expiry যাচাই করা যাচ্ছে না। Support-এর সঙ্গে যোগাযোগ করুন."};
        throw new Error(messages[data.code]||data.message||"Login যাচাই করা যায়নি।");
      }
      document.getElementById("router-username").value=data.username;
      document.getElementById("router-password").value=data.password;
      // Submit to RouterOS only after PostgreSQL MAC locking and provisioning succeed.
      form.submit();
    }catch(error){showError(error.message||"এখন login করা যাচ্ছে না। একই ডিভাইস থেকে আবার চেষ্টা করুন।");button.disabled=false;button.textContent="ইন্টারনেট চালু করুন";}
  });
})();
</script>
</body>
</html>
