<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - Gateway</title>
    <!-- আপনার গিটহাব/রেন্ডার থেকে স্টাইলশিট বা ফ্রেমওয়ার্ক এখানে কল হবে -->
    <style>
        /* বেসিক গ্লাসমরফিজম এবং ডাইনামিক লেআউট */
        body { margin: 0; font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .wrapper { max-width: 900px; width: 100%; display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: rgba(30,41,59,0.8); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); flex: 1; min-width: 300px; }
        .tabs { display: flex; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #94a3b8; }
        .tab.active { color: #0ea5e9; border-bottom: 2px solid #0ea5e9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0ea5e9; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .package-item { background: #1e293b; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .buy-btn { background: #10b981; padding: 5px 15px; border-radius: 5px; cursor: pointer; color: white; border: none;}
        .loading { text-align: center; color: #0ea5e9; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- লগইন সেকশন -->
    <div class="card">
        <h2 style="text-align: center; color: #0ea5e9;">FAZ NETWORK</h2>
        <div class="tabs">
            <div class="tab active" onclick="showTab('voucher')">ভাউচার</div>
            <div class="tab" onclick="showTab('member')">মেম্বার</div>
            <div class="tab" onclick="showTab('qr')">QR স্ক্যান</div>
        </div>

        <form name="login" action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />
            <!-- Lazy Provisioning ও Mac-Cookie এর জন্য -->
            <input type="hidden" id="clientMac" name="mac" value="$(mac)" />
            
            <div id="voucher" class="tab-content active">
                <input type="text" name="username" id="voucherInput" placeholder="ভাউচার কোড দিন">
                <input type="hidden" name="password" id="voucherPass">
                <button type="submit" onclick="document.getElementById('voucherPass').value = document.getElementById('voucherInput').value;">লগইন করুন</button>
            </div>

            <div id="member" class="tab-content">
                <input type="text" name="username" placeholder="ইউজারনেম">
                <input type="password" name="password" placeholder="পাসওয়ার্ড">
                <button type="submit">লগইন করুন</button>
            </div>

            <div id="qr" class="tab-content">
                <div style="height: 150px; border: 1px dashed #0ea5e9; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
                    ক্যামেরা ওপেন হবে
                </div>
                <button type="button">স্ক্যান করুন</button>
            </div>
        </form>
    </div>

    <!-- ডাইনামিক প্যাকেজ সেকশন (আপনার API থেকে আসবে) -->
    <div class="card">
        <h3 style="margin-top:0;">ইন্টারনেট প্যাকেজ</h3>
        <div id="packageContainer">
            <div class="loading">মাইক্রোটিক থেকে প্যাকেজ লোড হচ্ছে...</div>
        </div>
    </div>
</div>

<script>
    // ট্যাব চেঞ্জ করার লজিক
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    // আপনার Render ব্যাকএন্ড বা faznetwork.com API থেকে ডাইনামিক প্যাকেজ কল
    async function loadPackages() {
        const packageContainer = document.getElementById('packageContainer');
        const clientMac = document.getElementById('clientMac').value; // ম্যাক বাইন্ডিংয়ের জন্য

        try {
            // এটি আপনার আসল API এন্ডপয়েন্ট দিয়ে রিপ্লেস হবে (যেমন: https://api.faznetwork.com/v1/packages)
            const response = await fetch('https://api.faznetwork.com/v1/mikrotik/packages');
            const data = await response.json();
            
            packageContainer.innerHTML = ''; // Loading টেক্সট রিমুভ করা
            
            data.packages.forEach(pkg => {
                const pkgDiv = document.createElement('div');
                pkgDiv.className = 'package-item';
                pkgDiv.innerHTML = `
                    <div>
                        <strong style="font-size: 1.1em; color: #0ea5e9;">${pkg.name}</strong><br>
                        <small style="color: #94a3b8;">${pkg.validity} Days • ${pkg.speed}</small>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-weight: bold; font-size: 1.2em; color: #10b981; margin-bottom: 5px;">৳${pkg.price}</div>
                        <!-- বিকাশ/নগদ পেমেন্ট গেটওয়েতে ম্যাক অ্যাড্রেস ও প্যাকেজ আইডি পাঠানো হবে -->
                        <button class="buy-btn" onclick="initiatePayment('${pkg.id}', '${clientMac}')">কিনুন</button>
                    </div>
                `;
                packageContainer.appendChild(pkgDiv);
            });
        } catch (error) {
            packageContainer.innerHTML = '<p style="color: #ef4444;">প্যাকেজ লোড করতে সমস্যা হয়েছে। আপনার ব্যাকএন্ড সার্ভার (Render) চেক করুন।</p>';
        }
    }

    // পেমেন্ট গেটওয়েতে রিডাইরেক্ট করা (bKash/Nagad Auto Activation)
    function initiatePayment(packageId, macAddress) {
        // পেমেন্টের জন্য আপনার ব্যাকএন্ড পেমেন্ট URL-এ রিডাইরেক্ট 
        window.location.href = `https://pay.faznetwork.com/checkout?pkg=${packageId}&mac=${macAddress}`;
    }

    // পেজ লোড হলেই প্যাকেজগুলো ফেচ করা শুরু করবে
    window.onload = loadPackages;
</script>

</body>
</html>
