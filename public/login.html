<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAZ NETWORK - Hotspot Portal</title>
    <style>
        :root {
            --primary-islamic: #0a3d2e;
            --accent-gold: #f59e0b;
            --accent-glow: #10b981;
            --bg-dark: #041812;
            --card-bg: rgba(10, 35, 28, 0.92);
            --text-main: #f0fdf4;
            --text-muted: #94a3b8;
            --bkash-color: #e2136e;
            --nagad-color: #f7941d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.20) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(245, 158, 11, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(6, 78, 59, 0.35) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 14px;
            color: var(--text-main);
        }

        .glow-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(60deg, #f59e0b, #10b981, #047857, #d97706, #10b981, #f59e0b);
            background-size: 300% 300%;
            animation: rgbFlow 6s ease-in-out infinite;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.25), 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        @keyframes rgbFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 22px 18px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bismillah {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-gold);
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
            font-family: 'Amiri', 'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif;
        }

        .logo-box {
            margin-bottom: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-width: 95px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.5));
        }

        .brand-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.2px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .tab-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(5, 150, 105, 0.4);
        }

        .payment-account-card {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 14px;
            text-align: center;
        }

        .payment-account-title {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .badge-bkash {
            background: var(--bkash-color);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-nagad {
            background: var(--nagad-color);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .account-number {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            user-select: all;
            display: inline-block;
            background: rgba(245, 158, 11, 0.12);
            padding: 3px 12px;
            border-radius: 6px;
            border: 1px dashed rgba(245, 158, 11, 0.5);
            overflow-wrap: anywhere;
        }

        .send-money-alert {
            font-size: 11px;
            color: #a7f3d0;
            font-weight: 600;
            margin-top: 4px;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .pkg-card {
            display: block;
            width: 100%;
            min-width: 0;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 8px;
            padding: 9px 5px;
            text-align: center;
            color: inherit;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease, transform .2s ease;
        }

        .pkg-card:hover, .pkg-card:focus-visible {
            border-color: var(--accent-glow);
            outline: none;
        }

        .pkg-card.selected {
            border-color: var(--accent-glow);
            background: rgba(16, 185, 129, 0.15);
            box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.22), 0 0 12px rgba(16, 185, 129, 0.12);
        }

        .pkg-card:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .selected-package {
            margin: -4px 0 12px;
            color: #a7f3d0;
            font-size: 12px;
            text-align: left;
        }

        .payment-method-select {
            width: 100%;
            padding: 11px 12px;
            background: rgba(3, 20, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
        }
