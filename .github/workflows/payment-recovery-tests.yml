name: Payment Recovery Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/audit-remediation-core]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check controllers/paymentController.js
          node --check controllers/customerSelfCareController.js
          node --check services/paymentWebhookParser.js
          node --check test/hotspotWebhookDynamic.test.js
      - name: Run test suite
        run: npm test
