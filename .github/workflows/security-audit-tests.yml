name: Security Audit and Regression Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/all-in-one-settings-health-security]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Report npm audit findings
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const r=require('./npm-audit-report.json'); console.log(JSON.stringify({metadata:r.metadata?.vulnerabilities, advisories:Object.entries(r.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,range:x.range})}))},null,2))"
      - name: Require zero high or critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Syntax checks
        run: |
          node --check server.js
          node --check controllers/paymentController.js
          node --check controllers/settingsController.js
          node --check controllers/adminDiagnosticsController.js
          node --check services/paymentWebhookParser.js
          node --check services/mikrotikService.js
          node --check middleware/rbac.js
          node --check controllers/rbacAuthController.js
          node --check controllers/adminSecurityController.js
          node --check routes/adminUserRoutes.js
          node --check routes/adminSecurityRoutes.js
          node --check routes/paymentRoutes.js
          node --check routes/pppoeRoutes.js
          node --check public/js/rbac-sidebar.js
          node -e "const fs=require('fs'),ejs=require('ejs'); ejs.compile(fs.readFileSync('views/admin.ejs','utf8')); ejs.compile(fs.readFileSync('views/verify-otp.ejs','utf8')); console.log('RBAC EJS templates compile')"
      - name: Hotspot calendar validity syntax and build
        run: |
          node --check controllers/hotspotController.js
          node --check services/hotspotProfileConfig.js
          node --check jobs/hotspotExpirationCleanup.js
          npm run build
      - name: Admin popstate adapter regression test
        run: node --test test/admin-popstate-adapter.test.js
      - name: Regression tests
        run: npm test
