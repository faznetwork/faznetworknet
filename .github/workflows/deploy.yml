name: Auto Deploy to Local Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy and Restart
        shell: cmd
        run: |
          "D:\Git\cmd\git.exe" config --system --add safe.directory D:/faznetworknet 2>nul || ver >nul
          cd /d D:\faznetworknet && "D:\Git\cmd\git.exe" pull origin main && "D:\Git\cmd\git.exe" log -1 --oneline && set "GIT_EXECUTABLE=D:\Git\cmd\git.exe" && node scripts/write-deployment-info.js && call npx --yes pm2 restart faznetworknet
