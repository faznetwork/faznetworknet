name: Auto Deploy to Local Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy and Restart
        shell: cmd
        run: |
          cd /d D:\faznetworknet
          "D:\Git\cmd\git.exe" pull origin main
          call npx --yes pm2 restart all
