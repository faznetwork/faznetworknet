name: Auto Deploy to Local Server

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy and Restart
        shell: cmd
        run: |
          set "GIT_TERMINAL_PROMPT=0" && set "GCM_INTERACTIVE=Never" && set "PM2_HOME=C:\Users\RABBI-PC\.pm2" && cd /d D:\faznetworknet && "D:\Git\cmd\git.exe" config --system --add safe.directory D:/faznetworknet && "D:\Git\cmd\git.exe" -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer %GITHUB_TOKEN%" pull --ff-only origin main && "D:\Git\cmd\git.exe" log -1 --oneline && set "GIT_EXECUTABLE=D:\Git\cmd\git.exe" && node scripts/write-deployment-info.js && call "C:\Users\RABBI-PC\AppData\Roaming\npm\pm2.cmd" restart faznetworknet
