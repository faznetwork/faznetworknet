name: Self-Care Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check middleware/postgresRateLimiter.js && node --check test/reseller-rate-limit-pop-atomic.test.js
      - run: npm test
